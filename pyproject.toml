[project]
name = "pomodoro"
version = "0.1.0"
description = "A clean, minimal, animated pomodoro timer for your terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[project.scripts]
pomodoro = "pomodoro:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"